/****************************************************************
 *
 * PLANETARY OVERHEAD CALCULATOR
 *
 * Uses JPL approximate Keplerian orbital elements.
 *
 * The calculation is:
 *
 *       orbital elements
 *              ↓
 *       Kepler's equation
 *              ↓
 *       3D heliocentric position
 *              ↓
 *       Mars/Earth relative position
 *              ↓
 *       equatorial coordinates
 *              ↓
 *          RA and Dec
 *              ↓
 *       sidereal time
 *              ↓
 *       overhead latitude / longitude
 *
 ****************************************************************/


/****************************************************************
 * CONSTANTS
 ****************************************************************/

const DEG = Math.PI / 180;

const AU = 1;


/*
 * J2000 Julian Date.
 */

const J2000 = 2451545.0;


/*
 * Earth's obliquity at J2000.
 */

const EPSILON = 23.43928 * DEG;



/****************************************************************
 *
 * PLANETARY ELEMENTS
 *
 * JPL approximate elements.
 *
 * Every parameter is:
 *
 *       value + rate * T
 *
 * where T is Julian centuries since J2000.
 *
 ****************************************************************/


const PLANETS = {

    a1: 0.00000037,

},

/****************************************************************
 * COLORS
 ****************************************************************/

const PLANET_COLORS = {

    Mercury: 0xaaaaaa,
    Venus:   0xffcc88,
    Earth:   0x4488ff,
    Mars:    0xff5533,
    Jupiter: 0xddaa77,
    Saturn:  0xddbb88,
    Uranus:  0x66ccdd,
    Neptune: 0x4466ff

};



/****************************************************************
 * MATH UTILITIES
 ****************************************************************/


function rad(x) {
    return x * DEG;
}


function deg(x) {
    return x / DEG;
}


function normalizeDegrees(x) {

    x %= 360;

    if (x < 0)
        x += 360;

    return x;
}


function signedDegrees(x) {

    x = normalizeDegrees(x);

    if (x >= 180)
        x -= 360;

    return x;
}



/****************************************************************
 * JULIAN DATE
 ****************************************************************/


function julianDate(date) {

    return date.getTime() / 86400000 + 2440587.5;

}



/****************************************************************
 * KEPLER EQUATION
 ****************************************************************/


function solveKepler(M, e) {

    /*
     * Convert M to radians.
     */

    M = rad(signedDegrees(M));


    /*
     * Initial approximation.
     */

    let E =
        M + e * Math.sin(M);


    /*
     * Newton's method.
     */

    for (let n = 0; n < 30; n++) {

        const f =
            E - e * Math.sin(E) - M;

        const fp =
            1 - e * Math.cos(E);

        const correction =
            f / fp;

        E -= correction;

        if (Math.abs(correction) < 1e-12)
            break;
    }


    return E;

}



/****************************************************************
 * PLANET POSITION
 *
 * Returns J2000 ecliptic Cartesian coordinates in AU.
 ****************************************************************/


function planetPosition(name, T) {

    const p = PLANETS[name];


    /*
     * Elements at this date.
     */

    const a =
        p.a0 + p.a1*T;

    const e =
        p.e0 + p.e1*T;

    const inclination =
        rad(p.i0 + p.i1*T);

    const L =
        p.L0 + p.L1*T;

    const longitudePerihelion =
        p.peri0 + p.peri1*T;

    const node =
        p.node0 + p.node1*T;


    /*
     * Argument of perihelion:
     *
     * omega = varpi - Omega
     */

    const omega =
        rad(
            longitudePerihelion - node
        );


    /*
     * Mean anomaly:
     *
     * M = L - varpi
     */

    const M =
        L - longitudePerihelion;


    /*
     * Solve Kepler's equation.
     */

    const E =
        solveKepler(M, e);


    /*
     * Coordinates in orbital plane.
     */

    const xPrime =
        a * (Math.cos(E) - e);


    const yPrime =
        a *
        Math.sqrt(1 - e*e) *
        Math.sin(E);


    /*
     * Longitude of ascending node.
     */

    const O =
        rad(node);


    const cosO = Math.cos(O);
    const sinO = Math.sin(O);

    const cosw = Math.cos(omega);
    const sinw = Math.sin(omega);

    const cosi = Math.cos(inclination);
    const sini = Math.sin(inclination);


    /*
     * Rotate orbital plane into ecliptic coordinates.
     *
     * This is the full 3D rotation.
     */

    const x =

        (cosO*cosw - sinO*sinw*cosi)
        * xPrime

        +

        (-cosO*sinw - sinO*cosw*cosi)
        * yPrime;


    const y =

        (sinO*cosw + cosO*sinw*cosi)
        * xPrime

        +

        (-sinO*sinw + cosO*cosw*cosi)
        * yPrime;


    const z =

        (sinw*sini)
        * xPrime

        +

        (cosw*sini)
        * yPrime;


    return {
        x: x,
        y: y,
        z: z
    };

}



/****************************************************************
 * ECLIPTIC → EQUATORIAL
 ****************************************************************/


function eclipticToEquatorial(r) {

    return {

        x: r.x,

        y:
            Math.cos(EPSILON)*r.y
            -
            Math.sin(EPSILON)*r.z,

        z:
            Math.sin(EPSILON)*r.y
            +
            Math.cos(EPSILON)*r.z

    };

}



/****************************************************************
 * RA / DEC
 ****************************************************************/


function getRADec(r) {

    const distance =
        Math.sqrt(
            r.x*r.x +
            r.y*r.y +
            r.z*r.z
        );


    let ra =
        deg(
            Math.atan2(r.y, r.x)
        );


    ra =
        normalizeDegrees(ra);


    const dec =
        deg(
            Math.asin(
                r.z / distance
            )
        );


    return {

        raDegrees: ra,

        raHours: ra / 15,

        decDegrees: dec,

        distance: distance
    };

}



/****************************************************************
 * GREENWICH SIDEREAL TIME
 ****************************************************************/


function greenwichSiderealTime(JD) {

    const d =
        JD - J2000;


    const T =
        d / 36525;


    let theta =

        280.46061837

        +

        360.98564736629*d

        +

        0.000387933*T*T

        -

        T*T*T / 38710000;


    return normalizeDegrees(theta);

}



/****************************************************************
 * PRECESSION
 *
 * J2000 equatorial coordinates → equinox of date.
 ****************************************************************/


function precess(r, T) {

    const zeta =

        (
            2306.2181*T
            +
            0.30188*T*T
            +
            0.017998*T*T*T
        ) / 3600;


    const z =

        (
            2306.2181*T
            +
            1.09468*T*T
            +
            0.018203*T*T*T
        ) / 3600;


    const theta =

        (
            2004.3109*T
            -
            0.42665*T*T
            -
            0.041833*T*T*T
        ) / 3600;


    /*
     * First rotation.
     */

    const x1 =

        Math.cos(rad(zeta))*r.x
        +
        Math.sin(rad(zeta))*r.y;


    const y1 =

        -Math.sin(rad(zeta))*r.x
        +
        Math.cos(rad(zeta))*r.y;


    const z1 = r.z;


    /*
     * Second rotation.
     */

    const x2 =

        Math.cos(rad(theta))*x1
        -
        Math.sin(rad(theta))*z1;


    const y2 = y1;


    const z2 =

        Math.sin(rad(theta))*x1
        +
        Math.cos(rad(theta))*z1;


    /*
     * Third rotation.
     */

    return {

        x:
            Math.cos(rad(z))*x2
            +
            Math.sin(rad(z))*y2,

        y:
            -Math.sin(rad(z))*x2
            +
            Math.cos(rad(z))*y2,

        z:
            z2

    };

}



/****************************************************************
 * OVERHEAD POINT
 ****************************************************************/


function overheadPoint(raDegrees, decDegrees, GST) {

    /*
     * Local sidereal time:
     *
     *       LST = GST + longitude
     *
     *
     * At the sub-planet point:
     *
     *       LST = RA
     *
     *
     * Therefore:
     *
     *       longitude = RA - GST.
     */

    const longitude =
        signedDegrees(
            raDegrees - GST
        );


    const latitude =
        decDegrees;


    return {

        latitude: latitude,

        longitude: longitude

    };

}



/****************************************************************
 * FORMAT COORDINATES
 ****************************************************************/


function formatLatitude(x) {

    if (x >= 0)
        return x.toFixed(3) + "° N";

    return Math.abs(x).toFixed(3) + "° S";

}


function formatLongitude(x) {

    if (x >= 0)
        return x.toFixed(3) + "° E";

    return Math.abs(x).toFixed(3) + "° W";

}


function formatRA(hours) {

    const h =
        Math.floor(hours);


    const minutesDecimal =
        (hours - h) * 60;


    const m =
        Math.floor(minutesDecimal);


    const s =
        (minutesDecimal - m) * 60;


    return `${h}h ${m}m ${s.toFixed(1)}s`;

}



/****************************************************************
 * CALCULATE ALL PLANETS
 ****************************************************************/


function calculate() {

    const input =
        document.getElementById("datetime").value;


    if (!input) {

        alert("Please select a date and time.");

        return;
    }


    /*
     * Interpret the entered time as UTC.
     */

    const date =
        new Date(input + ":00Z");


    const JD =
        julianDate(date);


    const T =
        (JD - J2000) / 36525;


    const GST =
        greenwichSiderealTime(JD);


    const earth =
        planetPosition("Earth", T);


    const results = [];


    /*
     * Calculate every planet.
     */

    for (const name of Object.keys(PLANETS)) {

        if (name === "Earth")
            continue;


        const heliocentric =
            planetPosition(name, T);


        /*
         * Planet as seen from Earth's center.
         */

        const geocentric = {

            x:
                heliocentric.x
                -
                earth.x,

            y:
                heliocentric.y
                -
                earth.y,

            z:
                heliocentric.z
                -
                earth.z

        };


        /*
         * Ecliptic → equatorial.
         */

        const equatorial =
            eclipticToEquatorial(
                geocentric
            );


        /*
         * Precess to equinox of date.
         */

        const apparent =
            precess(
                equatorial,
                T
            );


        /*
         * RA / Dec.
         */

        const coords =
            getRADec(
                apparent
            );


        /*
         * Overhead point.
         */

        const overhead =
            overheadPoint(
                coords.raDegrees,
                coords.decDegrees,
                GST
            );


        results.push({

            name: name,

            ra: coords.raHours,

            dec: coords.decDegrees,

            distance: coords.distance,

            latitude: overhead.latitude,

            longitude: overhead.longitude

        });

    }


    displayResults(
        date,
        GST,
        results
    );


    update3D(
        T
    );

}



/****************************************************************
 * DISPLAY TABLE
 ****************************************************************/


function displayResults(date, GST, results) {

    let html = `

    <h2>Planetary positions</h2>

    <p>
        <strong>${date.toUTCString()}</strong>
    </p>

    <p class="small">
        Greenwich sidereal time:
        ${(GST/15).toFixed(4)} h
    </p>

    <table>

    <tr>
        <th>Planet</th>
        <th>RA</th>
        <th>Dec</th>
        <th>Overhead</th>
    </tr>
    `;


    for (const r of results) {

        html += `

        <tr>

        <td class="planet-name">
            ${r.name}
        </td>

        <td>
            ${formatRA(r.ra)}
        </td>

        <td>
            ${r.dec.toFixed(3)}°
        </td>

        <td>
            ${formatLatitude(r.latitude)}
            <br>
            ${formatLongitude(r.longitude)}
        </td>

        </tr>

        `;
    }


    html += `

    </table>

    <hr>

    <p class="small">

    <strong>Mathematics:</strong><br>

    Kepler's equation is solved by Newton's method.
    The resulting orbital-plane coordinates are rotated
    using the orbital inclination and longitude of the
    ascending node. The geocentric vector is then rotated
    from ecliptic to equatorial coordinates.

    </p>

    <p class="small">

    At the point where a planet is directly overhead,

    latitude = declination

    and

    longitude = RA − Greenwich sidereal time.

    </p>

    `;


    document.getElementById("results").innerHTML =
        html;

}



/****************************************************************
 *
 * THREE.JS 3D SOLAR SYSTEM
 *
 ****************************************************************/


let scene;
let camera;
let renderer;
let planetMeshes = {};
let orbitMeshes = {};



function initialize3D() {

    const container =
        document.getElementById("viewer");


    scene =
        new THREE.Scene();


    /*
     * Camera.
     */

    camera =
        new THREE.PerspectiveCamera(
            50,
            container.clientWidth /
            container.clientHeight,
            0.1,
            1000
        );


    camera.position.set(
        0,
        18,
        25
    );


    camera.lookAt(
        0,
        0,
        0
    );


    /*
     * Renderer.
     */

    renderer =
        new THREE.WebGLRenderer({
            antialias: true
        });


    renderer.setPixelRatio(
        window.devicePixelRatio
    );


    renderer.setSize(
        container.clientWidth,
        container.clientHeight
    );


    container.appendChild(
        renderer.domElement
    );


    /*
     * Sun.
     */

    const sunGeometry =
        new THREE.SphereGeometry(
            0.5,
            32,
            32
        );


    const sunMaterial =
        new THREE.MeshBasicMaterial({
            color: 0xffaa00
        });


    const sun =
        new THREE.Mesh(
            sunGeometry,
            sunMaterial
        );


    scene.add(sun);


    /*
     * Planets and orbits.
     */

    for (const name of Object.keys(PLANETS)) {

        if (name === "Earth")
            continue;


        const geometry =
            new THREE.SphereGeometry(
                0.12,
                20,
                20
            );


        const material =
            new THREE.MeshBasicMaterial({
                color:
                    PLANET_COLORS[name]
            });


        const mesh =
            new THREE.Mesh(
                geometry,
                material
            );


        scene.add(mesh);

        planetMeshes[name] =
            mesh;


        /*
         * Orbit.
         */

        createOrbit(name);

    }


    /*
     * Earth.
     */

    const earthGeometry =
        new THREE.SphereGeometry(
            0.14,
            20,
            20
        );


    const earthMaterial =
        new THREE.MeshBasicMaterial({
            color: PLANET_COLORS.Earth
        });


    const earthMesh =
        new THREE.Mesh(
            earthGeometry,
            earthMaterial
        );


    scene.add(
        earthMesh
    );


    planetMeshes.Earth =
        earthMesh;


    /*
     * Resize.
     */

    window.addEventListener(
        "resize",
        resize3D
    );


    /*
     * Animation.
     */

    animate3D();

}



/****************************************************************
 * CREATE ORBIT
 ****************************************************************/


function createOrbit(name) {

    const points = [];


    /*
     * We draw the orbit by varying eccentric anomaly.
     */

    for (let j = 0; j <= 200; j++) {

        const E =
            2*Math.PI*j/200;


        /*
         * Use J2000 elements for the shape.
         */

        const p =
            PLANETS[name];


        const a =
            p.a0;


        const e =
            p.e0;


        const i =
            rad(p.i0);


        const omega =
            rad(
                p.peri0 -
                p.node0
            );


        const O =
            rad(p.node0);


        const xPrime =
            a *
            (Math.cos(E) - e);


        const yPrime =
            a *
            Math.sqrt(1-e*e) *
            Math.sin(E);


        const cosO =
            Math.cos(O);

        const sinO =
            Math.sin(O);

        const cosw =
            Math.cos(omega);

        const sinw =
            Math.sin(omega);

        const cosi =
            Math.cos(i);

        const sini =
            Math.sin(i);


        const x =

            (cosO*cosw -
             sinO*sinw*cosi)
             * xPrime

            +

            (-cosO*sinw -
             sinO*cosw*cosi)
             * yPrime;


        const y =

            (sinO*cosw +
             cosO*sinw*cosi)
             * xPrime

            +

            (-sinO*sinw +
             cosO*cosw*cosi)
             * yPrime;


        const z =

            sinw*sini*xPrime
            +
            cosw*sini*yPrime;


        /*
         * Scale the solar system.
         */

        points.push(
            new THREE.Vector3(
                x,
                z,
                -y
            )
        );

    }


    const geometry =
        new THREE.BufferGeometry()
            .setFromPoints(points);


    const material =
        new THREE.LineBasicMaterial({
            color:
                PLANET_COLORS[name],
            transparent: true,
            opacity: 0.35
        });


    const orbit =
        new THREE.Line(
            geometry,
            material
        );


    scene.add(orbit);

    orbitMeshes[name] =
        orbit;

}



/****************************************************************
 * UPDATE 3D POSITIONS
 ****************************************************************/


function update3D(T) {

    for (const name of Object.keys(PLANETS)) {

        const p =
            planetPosition(
                name,
                T
            );


        const mesh =
            planetMeshes[name];


        if (!mesh)
            continue;


        /*
         * Three.js uses:
         *
         * x = ecliptic X
         * y = ecliptic Z
         * z = -ecliptic Y
         *
         * This gives a convenient visual orientation.
         */

        mesh.position.set(
            p.x,
            p.z,
            -p.y
        );

    }

}



/****************************************************************
 * HIGHLIGHT PLANET
 ****************************************************************/


function highlightPlanet() {

    const selected =
        document.getElementById(
            "planetSelect"
        ).value;


    for (const name of Object.keys(planetMeshes)) {

        const mesh =
            planetMeshes[name];


        if (selected === "all") {

            mesh.scale.set(
                1,1,1
            );

        } else if (name === selected) {

            mesh.scale.set(
                2.5,2.5,2.5
            );

        } else {

            mesh.scale.set(
                1,1,1
            );

        }

    }

}



/****************************************************************
 * ANIMATION
 ****************************************************************/


function animate3D() {

    requestAnimationFrame(
        animate3D
    );


    /*
     * Slowly rotate the entire scene.
     */

    scene.rotation.y += 0.001;


    renderer.render(
        scene,
        camera
    );

}



/****************************************************************
 * RESIZE
 ****************************************************************/


function resize3D() {

    const container =
        document.getElementById("viewer");


    camera.aspect =
        container.clientWidth /
        container.clientHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        container.clientWidth,
        container.clientHeight
    );

}



/****************************************************************
 * DEFAULT TIME
 ****************************************************************/


function setDefaultTime() {

    const now =
        new Date();


    const year =
        now.getUTCFullYear();


    const month =
        String(
            now.getUTCMonth()+1
        ).padStart(2,"0");


    const day =
        String(
            now.getUTCDate()
        ).padStart(2,"0");


    const hour =
        String(
            now.getUTCHours()
        ).padStart(2,"0");


    const minute =
        String(
            now.getUTCMinutes()
        ).padStart(2,"0");


    document.getElementById(
        "datetime"
    ).value =
        `${year}-${month}-${day}T${hour}:${minute}`;

}



/****************************************************************
 * START
 ****************************************************************/


initialize3D();

setDefaultTime();

calculate();

</script>
