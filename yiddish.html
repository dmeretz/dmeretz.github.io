
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<title>Mars Overhead</title>

<style>

body {
    font-family: Arial, sans-serif;
    max-width: 850px;
    margin: 40px auto;
    padding: 0 20px;
    line-height: 1.5;
}

h1 {
    margin-bottom: 5px;
}

.subtitle {
    color: #555;
}

input {
    font-size: 17px;
    padding: 7px;
}

button {
    font-size: 17px;
    padding: 9px 18px;
    cursor: pointer;
}

#results {
    margin-top: 25px;
    padding: 20px;
    border: 1px solid #ccc;
    border-radius: 8px;
}

.big {
    font-size: 28px;
    font-weight: bold;
}

canvas {
    display: block;
    margin-top: 30px;
    border: 1px solid #ccc;
}

.equation {
    font-family: Georgia, serif;
    font-size: 18px;
}

</style>
</head>


<body>

<h1>Where is Mars overhead?</h1>

<p class="subtitle">
A Keplerian calculation using JPL's approximate planetary elements.
</p>

<p>
Choose a time and the program will calculate the point on Earth
where Mars is directly overhead.
</p>


<label>
    Date and time (UTC):
    <input id="datetime" type="datetime-local">
</label>

<button onclick="calculateMars()">
    Calculate
</button>


<div id="results">
    Enter a date and press Calculate.
</div>


<canvas id="solarSystem"
        width="700"
        height="700">
</canvas>



<script>

/************************************************************
 *
 *  MARS OVERHEAD
 *
 *  This program uses the JPL/Standish approximate Keplerian
 *  elements for Earth and Mars.
 *
 *  Valid approximately 1800--2050.
 *
 ************************************************************/


/************************************************************
 * CONSTANTS
 ************************************************************/

const DEG = Math.PI / 180;


/*
 * J2000 epoch:
 *
 * January 1, 2000, 12:00 UTC
 *
 * Julian Date = 2451545.0
 */

const J2000 = 2451545.0;


/*
 * Obliquity of the ecliptic at J2000.
 */

const EPSILON = 23.43928 * DEG;



/************************************************************
 *
 * JPL KEPLERIAN ELEMENTS
 *
 * Elements are referred to the mean ecliptic and equinox
 * of J2000.
 *
 * Each quantity is:
 *
 *     value at J2000
 *
 * plus
 *
 *     rate per Julian century.
 *
 ************************************************************/


/*
 * Earth-Moon barycenter.
 *
 * For this simple model we use the Earth-Moon barycenter
 * as Earth's position. This is what JPL's published
 * approximate-element table provides.
 */

const EARTH = {

    a0: 1.00000261,
    a1: 0.00000562,

    e0: 0.01671123,
    e1: -0.00004392,

    i0: -0.00001531,
    i1: -0.01294668,

    L0: 100.46457166,
    L1: 35999.37244981,

    peri0: 102.93768193,
    peri1: 0.32327364,

    node0: 0.0,
    node1: 0.0
};


/*
 * Mars.
 */

const MARS = {

    a0: 1.52371034,
    a1: 0.00001847,

    e0: 0.09339410,
    e1: 0.00007882,

    i0: 1.84969142,
    i1: -0.00813131,

    L0: -4.55343205,
    L1: 19140.30268499,

    peri0: -23.94362959,
    peri1: 0.44441088,

    node0: 49.55953891,
    node1: -0.29257343
};



/************************************************************
 * UTILITY FUNCTIONS
 ************************************************************/

function deg(x) {
    return x / DEG;
}


function rad(x) {
    return x * DEG;
}


/*
 * Put an angle into [0,360).
 */

function normalizeDegrees(x) {

    x = x % 360;

    if (x < 0)
        x += 360;

    return x;
}


/*
 * Put an angle into [-180,180).
 */

function signedDegrees(x) {

    x = normalizeDegrees(x);

    if (x >= 180)
        x -= 360;

    return x;
}



/************************************************************
 * JULIAN DATE
 ************************************************************/


function julianDate(date) {

    return date.getTime() / 86400000 + 2440587.5;

}



/************************************************************
 * PLANETARY ELEMENTS
 ************************************************************/


function getElements(planet, T) {

    return {

        a:
            planet.a0 +
            planet.a1 * T,

        e:
            planet.e0 +
            planet.e1 * T,

        i:
            rad(
                planet.i0 +
                planet.i1 * T
            ),

        L:
            planet.L0 +
            planet.L1 * T,

        peri:
            planet.peri0 +
            planet.peri1 * T,

        node:
            planet.node0 +
            planet.node1 * T
    };

}



/************************************************************
 *
 * KEPLER'S EQUATION
 *
 * M = E - e sin(E)
 *
 * Newton's method:
 *
 * E_(n+1) =
 *
 * E_n -
 *
 * (E_n - e sin(E_n) - M)
 * -----------------------
 *       1 - e cos(E_n)
 *
 ************************************************************/


function solveKepler(M, e) {

    /*
     * Work in radians.
     */

    M = rad(signedDegrees(deg(M)));

    /*
     * A good starting approximation.
     */

    let E =
        M + e * Math.sin(M);


    for (let k = 0; k < 20; k++) {

        const f =
            E - e * Math.sin(E) - M;

        const fp =
            1 - e * Math.cos(E);

        const correction =
            f / fp;

        E -= correction;

        if (Math.abs(correction) < 1e-12)
            break;
    }

    return E;
}



/************************************************************
 *
 * PLANET POSITION
 *
 * First calculate the position in the orbital plane:
 *
 * x' = a(cos E - e)
 *
 * y' = a sqrt(1-e²) sin E
 *
 * Then rotate by omega, inclination and node.
 *
 ************************************************************/


function planetPosition(planet, T) {

    const p =
        getElements(planet, T);


    /*
     * Argument of perihelion.
     */

    const omega =
        p.peri - p.node;


    /*
     * Mean anomaly.
     */

    const M =
        p.L - p.peri;


    /*
     * Solve Kepler's equation.
     */

    const E =
        solveKepler(M, p.e);


    /*
     * Coordinates in orbital plane.
     */

    const xPrime =
        p.a *
        (Math.cos(E) - p.e);


    const yPrime =
        p.a *
        Math.sqrt(1 - p.e*p.e) *
        Math.sin(E);


    /*
     * Convert angles to radians.
     */

    const w = rad(omega);

    const O = rad(p.node);

    const inc = p.i;


    /*
     * Rotation from orbital coordinates to
     * J2000 ecliptic coordinates.
     *
     * z' = 0.
     */

    const x =
        (
            Math.cos(w)*Math.cos(O)
            -
            Math.sin(w)*Math.sin(O)*Math.cos(inc)
        ) * xPrime

        +

        (
            -Math.sin(w)*Math.cos(O)
            -
            Math.cos(w)*Math.sin(O)*Math.cos(inc)
        ) * yPrime;


    const y =
        (
            Math.cos(w)*Math.sin(O)
            +
            Math.sin(w)*Math.cos(O)*Math.cos(inc)
        ) * xPrime

        +

        (
            -Math.sin(w)*Math.sin(O)
            +
            Math.cos(w)*Math.cos(O)*Math.cos(inc)
        ) * yPrime;


    const z =
        Math.sin(w)*Math.sin(inc)*xPrime
        +
        Math.cos(w)*Math.sin(inc)*yPrime;


    return {
        x: x,
        y: y,
        z: z
    };

}



/************************************************************
 *
 * ECLIPTIC → EQUATORIAL
 *
 * JPL gives:
 *
 * Xeq = Xecl
 *
 * Yeq = cos(epsilon) Yecl - sin(epsilon) Zecl
 *
 * Zeq = sin(epsilon) Yecl + cos(epsilon) Zecl
 *
 ************************************************************/


function eclipticToEquatorial(r) {

    const X =
        r.x;

    const Y =
        Math.cos(EPSILON)*r.y
        -
        Math.sin(EPSILON)*r.z;

    const Z =
        Math.sin(EPSILON)*r.y
        +
        Math.cos(EPSILON)*r.z;


    return {
        x: X,
        y: Y,
        z: Z
    };

}



/************************************************************
 *
 * RIGHT ASCENSION AND DECLINATION
 *
 ************************************************************/


function raDec(r) {

    const distance =
        Math.sqrt(
            r.x*r.x +
            r.y*r.y +
            r.z*r.z
        );


    let ra =
        Math.atan2(r.y, r.x);


    ra =
        normalizeDegrees(deg(ra));


    const dec =
        deg(
            Math.asin(r.z / distance)
        );


    return {
        raDegrees: ra,
        raHours: ra / 15,
        decDegrees: dec,
        distance: distance
    };

}



/************************************************************
 *
 * GREENWICH MEAN SIDEREAL TIME
 *
 * Formula from the standard astronomical expression:
 *
 * GMST =
 *
 * 280.46061837
 *
 * + 360.98564736629 * (JD - 2451545.0)
 *
 * + 0.000387933 T²
 *
 * - T³/38710000
 *
 * where
 *
 * T = centuries since J2000.
 *
 ************************************************************/


function greenwichSiderealTime(JD) {

    const d =
        JD - 2451545.0;


    const T =
        d / 36525.0;


    let theta =
        280.46061837

        +

        360.98564736629 * d

        +

        0.000387933 * T*T

        -

        T*T*T / 38710000;


    return normalizeDegrees(theta);

}



/************************************************************
 *
 * PRECESSION
 *
 * Our planetary coordinates are referred to J2000.
 *
 * Sidereal time, however, is tied to the Earth's equinox
 * of date.
 *
 * We therefore precess the J2000 equatorial coordinates
 * to the equator/equinox of the observation date.
 *
 ************************************************************/


function precessJ2000ToDate(r, T) {

    /*
     * IAU precession angles in arcseconds.
     */

    const zeta =
        (
            2306.2181*T
            +
            0.30188*T*T
            +
            0.017998*T*T*T
        ) / 3600;


    const z =
        (
            2306.2181*T
            +
            1.09468*T*T
            +
            0.018203*T*T*T
        ) / 3600;


    const theta =
        (
            2004.3109*T
            -
            0.42665*T*T
            -
            0.041833*T*T*T
        ) / 3600;


    const A = rad(r.x);
    const B = rad(r.y);
    const C = rad(r.z);


    /*
     * Rotation R3(-zeta).
     */

    const x1 =
        Math.cos(rad(zeta))*r.x
        +
        Math.sin(rad(zeta))*r.y;

    const y1 =
        -Math.sin(rad(zeta))*r.x
        +
        Math.cos(rad(zeta))*r.y;

    const z1 =
        r.z;


    /*
     * Rotation R2(theta).
     */

    const x2 =
        Math.cos(rad(theta))*x1
        -
        Math.sin(rad(theta))*z1;

    const y2 =
        y1;

    const z2 =
        Math.sin(rad(theta))*x1
        +
        Math.cos(rad(theta))*z1;


    /*
     * Rotation R3(-z).
     */

    const x3 =
        Math.cos(rad(z))*x2
        +
        Math.sin(rad(z))*y2;

    const y3 =
        -Math.sin(rad(z))*x2
        +
        Math.cos(rad(z))*y2;

    const z3 =
        z2;


    return {
        x: x3,
        y: y3,
        z: z3
    };

}



/************************************************************
 *
 * CALCULATE THE OVERHEAD POINT
 *
 * At the point directly underneath Mars:
 *
 *       latitude = declination
 *
 * and
 *
 *       local sidereal time = right ascension.
 *
 *
 * Since
 *
 *       LST = GST + longitude
 *
 * we get
 *
 *       longitude = RA - GST.
 *
 ************************************************************/


function overheadPoint(raHours, decDegrees, GST) {

    const raDegrees =
        raHours * 15;


    let longitude =
        raDegrees - GST;


    longitude =
        signedDegrees(longitude);


    return {
        latitude: decDegrees,
        longitude: longitude
    };

}



/************************************************************
 *
 * FORMAT LATITUDE / LONGITUDE
 *
 ************************************************************/


function formatLatitude(x) {

    if (x >= 0)
        return x.toFixed(3) + "° N";

    return Math.abs(x).toFixed(3) + "° S";
}


function formatLongitude(x) {

    if (x >= 0)
        return x.toFixed(3) + "° E";

    return Math.abs(x).toFixed(3) + "° W";
}



/************************************************************
 *
 * MAIN CALCULATION
 ************************************************************/


function calculateMars() {

    const input =
        document.getElementById("datetime").value;


    if (!input) {

        alert("Please choose a date and time.");

        return;
    }


    /*
     * datetime-local gives local-looking time with no
     * timezone. We explicitly interpret it as UTC.
     */

    const date =
        new Date(input + ":00Z");


    /*
     * Julian date.
     */

    const JD =
        julianDate(date);


    /*
     * Julian centuries since J2000.
     */

    const T =
        (JD - J2000) / 36525;


    /*
     * Heliocentric positions.
     */

    const earth =
        planetPosition(EARTH, T);


    const mars =
        planetPosition(MARS, T);


    /*
     * Mars as seen from Earth.
     */

    const geocentric = {

        x: mars.x - earth.x,

        y: mars.y - earth.y,

        z: mars.z - earth.z
    };


    /*
     * Convert from ecliptic to equatorial.
     */

    const equatorial =
        eclipticToEquatorial(geocentric);


    /*
     * Precess J2000 coordinates to the date.
     */

    const apparentFrame =
        precessJ2000ToDate(
            equatorial,
            T
        );


    /*
     * RA and declination.
     */

    const coordinates =
        raDec(apparentFrame);


    /*
     * Greenwich sidereal time.
     */

    const GST =
        greenwichSiderealTime(JD);


    /*
     * Overhead point.
     */

    const overhead =
        overheadPoint(
            coordinates.raHours,
            coordinates.decDegrees,
            GST
        );


    /*
     * Display.
     */

    document.getElementById("results").innerHTML = `

        <h2>Mars is directly overhead at approximately:</h2>

        <p class="big">
            ${formatLatitude(overhead.latitude)}
            <br>
            ${formatLongitude(overhead.longitude)}
        </p>

        <hr>

        <p>
            <strong>UTC:</strong>
            ${date.toUTCString()}
        </p>

        <p>
            <strong>Right Ascension:</strong>
            ${coordinates.raHours.toFixed(4)} h
        </p>

        <p>
            <strong>Declination:</strong>
            ${coordinates.decDegrees.toFixed(4)}°
        </p>

        <p>
            <strong>Distance from Earth:</strong>
            ${coordinates.distance.toFixed(6)} AU
        </p>

        <p>
            <strong>Greenwich sidereal time:</strong>
            ${(GST / 15).toFixed(4)} h
        </p>

        <hr>

        <p>
            <strong>Model:</strong>
            JPL approximate Keplerian elements
            + Newton's method
            + coordinate rotations
            + precession
            + sidereal time
        </p>

    `;


    /*
     * Draw the solar system.
     */

    drawSolarSystem(
        earth,
        mars
    );

}



/************************************************************
 *
 * DRAW SOLAR SYSTEM
 *
 ************************************************************/


function drawSolarSystem(earth, mars) {

    const canvas =
        document.getElementById("solarSystem");

    const ctx =
        canvas.getContext("2d");


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const cx =
        canvas.width / 2;

    const cy =
        canvas.height / 2;


    /*
     * Scale.
     */

    const scale = 180;


    /*
     * Orbit radii.
     */

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        scale,
        0,
        2*Math.PI
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        1.524 * scale,
        0,
        2*Math.PI
    );

    ctx.stroke();


    /*
     * Earth.
     */

    const ex =
        cx + earth.x * scale;

    const ey =
        cy - earth.y * scale;


    /*
     * Mars.
     */

    const mx =
        cx + mars.x * scale;

    const my =
        cy - mars.y * scale;


    /*
     * Sun.
     */

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        10,
        0,
        2*Math.PI
    );

    ctx.fillStyle = "orange";

    ctx.fill();


    /*
     * Earth.
     */

    ctx.beginPath();

    ctx.arc(
        ex,
        ey,
        6,
        0,
        2*Math.PI
    );

    ctx.fillStyle = "blue";

    ctx.fill();

    ctx.fillStyle = "black";

    ctx.fillText(
        "Earth",
        ex + 10,
        ey
    );


    /*
     * Mars.
     */

    ctx.beginPath();

    ctx.arc(
        mx,
        my,
        7,
        0,
        2*Math.PI
    );

    ctx.fillStyle = "red";

    ctx.fill();

    ctx.fillStyle = "black";

    ctx.fillText(
        "Mars",
        mx + 10,
        my
    );


    /*
     * Line from Earth to Mars.
     */

    ctx.beginPath();

    ctx.moveTo(ex, ey);

    ctx.lineTo(mx, my);

    ctx.stroke();


    ctx.fillText(
        "Sun",
        cx + 15,
        cy
    );

}



/************************************************************
 *
 * SET DEFAULT TIME
 *
 ************************************************************/


function setDefaultTime() {

    const now =
        new Date();


    /*
     * Convert to YYYY-MM-DDTHH:MM
     * in UTC.
     */

    const year =
        now.getUTCFullYear();


    const month =
        String(now.getUTCMonth()+1)
        .padStart(2,"0");


    const day =
        String(now.getUTCDate())
        .padStart(2,"0");


    const hour =
        String(now.getUTCHours())
        .padStart(2,"0");


    const minute =
        String(now.getUTCMinutes())
        .padStart(2,"0");


    document.getElementById("datetime").value =
        `${year}-${month}-${day}T${hour}:${minute}`;

}


setDefaultTime();

</script>

</body>
</html>
