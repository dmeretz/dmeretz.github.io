
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JPL Keplerian Planetary Model</title>

<style>
    body {
        margin: 0;
        background: #05070d;
        color: #eee;
        font-family: system-ui, sans-serif;
    }

    #ui {
        position: absolute;
        top: 15px;
        left: 15px;
        z-index: 10;
        background: rgba(0,0,0,.78);
        padding: 18px;
        border-radius: 10px;
        width: 360px;
    }

    h1 {
        font-size: 20px;
        margin-top: 0;
    }

    label {
        display: block;
        margin-top: 10px;
        font-size: 13px;
    }

    input, select, button {
        width: 100%;
        box-sizing: border-box;
        margin-top: 4px;
        padding: 7px;
        border-radius: 5px;
        border: 1px solid #555;
        background: #151922;
        color: white;
    }

    button {
        cursor: pointer;
        margin-top: 14px;
    }

    #info {
        margin-top: 15px;
        font-size: 13px;
        line-height: 1.5;
    }

    table {
        border-collapse: collapse;
        margin-top: 15px;
        font-size: 12px;
        width: 100%;
    }

    th, td {
        border-bottom: 1px solid #444;
        padding: 5px;
        text-align: right;
    }

    th:first-child,
    td:first-child {
        text-align: left;
    }

    #canvas {
        width: 100vw;
        height: 100vh;
    }
</style>
</head>

<body>

<div id="ui">

<h1>Planetary Ephemeris</h1>

<label>
    Date and time (UTC)
    <input id="datetime" type="datetime-local">
</label>

<label>
    Display planet
    <select id="planetSelect">
        <option value="Mercury">Mercury</option>
        <option value="Venus">Venus</option>
        <option value="Mars" selected>Mars</option>
        <option value="Jupiter">Jupiter</option>
        <option value="Saturn">Saturn</option>
        <option value="Uranus">Uranus</option>
        <option value="Neptune">Neptune</option>
	<option value="Pluto">Pluto</option>
    </select>
</label>

<button onclick="calculate()">Calculate</button>

<div id="info"></div>

<table>
<thead>
<tr>
    <th>Planet</th>
    <th>RA</th>
    <th>Dec</th>
    <th>Lat.</th>
    <th>Long.</th>
</tr>
</thead>
<tbody id="results"></tbody>
</table>

</div>

<div id="canvas"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/*
=========================================================
JPL APPROXIMATE PLANETARY ELEMENTS
1800–2050
=========================================================

For each quantity:

value(T) = value0 + value1*T

where

T = Julian centuries from J2000.0.

Angles are degrees.
Distances are astronomical units.

These are the JPL Table 1 values.
*/

const planets = {

Mercury: {
    a: [0.38709927, 0.00000037],
    e: [0.20563593, 0.00001906],
    i: [7.00497902, -0.00594749],
    L: [252.25032350, 149472.67411175],
    peri: [77.45779628, 0.16047689],
    node: [48.33076593, -0.12534081]
},

Venus: {
    a: [0.72333566, 0.00000390],
    e: [0.00677672, -0.00004107],
    i: [3.39467605, -0.00078890],
    L: [181.97909950, 58517.81538729],
    peri: [131.60246718, 0.00268329],
    node: [76.67984255, -0.27769418]
},

Earth: {
    a: [1.00000261, 0.00000562],
    e: [0.01671123, -0.00004392],
    i: [-0.00001531, -0.01294668],
    L: [100.46457166, 35999.37244981],
    peri: [102.93768193, 0.32327364],
    node: [0, 0]
},

Mars: {
    a: [1.52371034, 0.00001847],
    e: [0.09339410, 0.00007882],
    i: [1.84969142, -0.00813131],
    L: [-4.55343205, 19140.30268499],
    peri: [-23.94362959, 0.44441088],
    node: [49.55953891, -0.29257343]
},

Jupiter: {
    a: [5.20288700, -0.00011607],
    e: [0.04838624, -0.00013253],
    i: [1.30439695, -0.00183714],
    L: [34.39644051, 3034.74612775],
    peri: [14.72847983, 0.21252668],
    node: [100.47390909, 0.20469106]
},

Saturn: {
    a: [9.53667594, -0.00125060],
    e: [0.05386179, -0.00050991],
    i: [2.48599187, 0.00193609],
    L: [49.95424423, 1222.49362201],
    peri: [92.59887831, -0.41897216],
    node: [113.66242448, -0.28867794]
},

Uranus: {
    a: [19.18916464, -0.00196176],
    e: [0.04725744, -0.00004397],
    i: [0.77263783, -0.00242939],
    L: [313.23810451, 428.48202785],
    peri: [170.95427630, 0.40805281],
    node: [74.01692503, 0.04240589]
},

Neptune: {
    a: [30.06992276, 0.00026291],
    e: [0.00859048, 0.00005105],
    i: [1.77004347, 0.00035372],
    L: [-55.12002969, 218.45945325],
    peri: [44.96476227, -0.32241464],
    node: [131.78422574, -0.00508664]
},

Pluto: {
    a: [39.48211675, -0.00031596],
    e: [0.24882730,  0.00005170],
    i: [17.14001206, 0.00004818],
    L: [238.92903833, 145.20780515],
    peri: [224.06891629, -0.04062942],
    node: [110.30393684, -0.01183482]
}

};


/* =====================================================
   BASIC MATH
===================================================== */

const DEG = Math.PI / 180;

function degToRad(x) {
    return x * DEG;
}

function radToDeg(x) {
    return x / DEG;
}

function mod360(x) {
    return ((x % 360) + 360) % 360;
}


/* =====================================================
   JULIAN DATE
===================================================== */

function julianDate(date) {

    let year = date.getUTCFullYear();
    let month = date.getUTCMonth() + 1;
    let day = date.getUTCDate();

    let hour =
        date.getUTCHours()
        + date.getUTCMinutes() / 60
        + date.getUTCSeconds() / 3600;

    if (month <= 2) {
        year -= 1;
        month += 12;
    }

    const A = Math.floor(year / 100);
    const B = 2 - A + Math.floor(A / 4);

    return Math.floor(365.25 * (year + 4716))
         + Math.floor(30.6001 * (month + 1))
         + day
         + B
         - 1524.5
         + hour / 24;
}


/* =====================================================
   PLANETARY ELEMENTS
===================================================== */

function elementsAt(name, T) {

    const p = planets[name];

    return {
        a: p.a[0] + p.a[1] * T,
        e: p.e[0] + p.e[1] * T,
        i: p.i[0] + p.i[1] * T,
        L: p.L[0] + p.L[1] * T,
        peri: p.peri[0] + p.peri[1] * T,
        node: p.node[0] + p.node[1] * T
    };
}


/* =====================================================
   KEPLER'S EQUATION

   M = E - e sin(E)

   Solve using Newton's method.
===================================================== */

function solveKepler(M, e) {

    M = M % (2 * Math.PI);

    let E = M + e * Math.sin(M);

    for (let k = 0; k < 20; k++) {

        const f = E - e * Math.sin(E) - M;

        const fp = 1 - e * Math.cos(E);

        const correction = f / fp;

        E -= correction;

        if (Math.abs(correction) < 1e-12)
            break;
    }

    return E;
}


/* =====================================================
   PLANET POSITION IN HELIOCENTRIC ECLIPTIC J2000

   JPL gives:

       L = mean longitude
       peri = longitude of perihelion
       node = longitude of ascending node

   Therefore:

       M = L - peri
       omega = peri - node

===================================================== */

function planetPosition(name, T) {

    const el = elementsAt(name, T);

    const a = el.a;
    const e = el.e;

    const M = degToRad(mod360(el.L - el.peri));

    const E = solveKepler(M, e);

    /*
       Position in orbital plane.
    */

    const xOrb =
        a * (Math.cos(E) - e);

    const yOrb =
        a * Math.sqrt(1 - e * e) * Math.sin(E);

    /*
       Argument of perihelion.
    */

    const omega =
        degToRad(el.peri - el.node);

    const Omega =
        degToRad(el.node);

    const inc =
        degToRad(el.i);

    /*
       Rotate:

       orbital plane
          ->
       ecliptic J2000
    */

    const cosO = Math.cos(Omega);
    const sinO = Math.sin(Omega);

    const cosw = Math.cos(omega);
    const sinw = Math.sin(omega);

    const cosi = Math.cos(inc);
    const sini = Math.sin(inc);

    const x =
        (cosO*cosw - sinO*sinw*cosi) * xOrb
        + (-cosO*sinw - sinO*cosw*cosi) * yOrb;

    const y =
        (sinO*cosw + cosO*sinw*cosi) * xOrb
        + (-sinO*sinw + cosO*cosw*cosi) * yOrb;

    const z =
        (sinw*sini) * xOrb
        + (cosw*sini) * yOrb;

    return new THREE.Vector3(x, y, z);
}


/* =====================================================
   ECLIPTIC -> EQUATORIAL

   J2000 obliquity:
       epsilon = 23.43928 degrees
===================================================== */

const epsilon = degToRad(23.43928);

function eclipticToEquatorial(v) {

    return new THREE.Vector3(
        v.x,
        v.y * Math.cos(epsilon) - v.z * Math.sin(epsilon),
        v.y * Math.sin(epsilon) + v.z * Math.cos(epsilon)
    );
}


/* =====================================================
   PRECESSION

   J2000 -> equator of date

   Standard approximate precession angles.
===================================================== */

function precess(v, T) {

    const zeta =
        degToRad(
            (2306.2181*T
            + 0.30188*T*T
            + 0.017998*T*T*T) / 3600
        );

    const z =
        degToRad(
            (2306.2181*T
            + 1.09468*T*T
            + 0.018203*T*T*T) / 3600
        );

    const theta =
        degToRad(
            (2004.3109*T
            - 0.42665*T*T
            - 0.041833*T*T*T) / 3600
        );

    /*
       Apply R3(-zeta), R2(theta), R3(-z)
       to the J2000 vector.
    */

    let x = v.x;
    let y = v.y;
    let zz = v.z;

    let c = Math.cos(zeta);
    let s = Math.sin(zeta);

    let x1 = c*x + s*y;
    let y1 = -s*x + c*y;

    let cth = Math.cos(theta);
    let sth = Math.sin(theta);

    let x2 = cth*x1 - sth*zz;
    let z2 = sth*x1 + cth*zz;

    c = Math.cos(z);
    s = Math.sin(z);

    let x3 = c*x2 + s*y1;
    let y3 = -s*x2 + c*y1;

    return new THREE.Vector3(x3, y3, z2);
}


/* =====================================================
   RA / DECLINATION
===================================================== */

function raDec(v) {

    const r = v.length();

    let ra =
        radToDeg(Math.atan2(v.y, v.x));

    ra = mod360(ra);

    const dec =
        radToDeg(Math.asin(v.z / r));

    return {
        ra,
        dec
    };
}


/* =====================================================
   GREENWICH MEAN SIDEREAL TIME

   Approximate formula.

   d = days since J2000.0
===================================================== */

function gmst(JD) {

    const d = JD - 2451545.0;

    const T = d / 36525;

    let value =
        280.46061837
        + 360.98564736629*d
        + 0.000387933*T*T
        - T*T*T/38710000;

    return mod360(value);
}


/* =====================================================
   OVERHEAD POINT
===================================================== */

function overhead(ra, dec, gst) {

    const latitude = dec;

    /*
       Longitude positive east.
    */

    let longitude =
        mod360(ra - gst);

    if (longitude > 180)
        longitude -= 360;

    return {
        latitude,
        longitude
    };
}


/* =====================================================
   MAIN CALCULATION
===================================================== */

function calculate() {

    const input =
        document.getElementById("datetime").value;

    if (!input)
        return;

    /*
       datetime-local has no timezone.

       We interpret the entered time as UTC.
    */

    const date =
        new Date(input + ":00Z");

    const JD =
        julianDate(date);

    const T =
        (JD - 2451545.0) / 36525;

    /*
       Calculate Earth position.
    */

    const earthEcl =
        planetPosition("Earth", T);

    const rows = [];

    const planetNames = [
        "Mercury",
        "Venus",
        "Mars",
        "Jupiter",
        "Saturn",
        "Uranus",
        "Neptune",
	"Pluto"

    ];

    for (const name of planetNames) {

        /*
           Heliocentric planet position.
        */

        const planetEcl =
            planetPosition(name, T);

        /*
           Geocentric vector:
               planet - Earth
        */

        const geoEcl =
            planetEcl.clone().sub(earthEcl);

        /*
           Convert to equatorial coordinates.
        */

        const geoEqJ2000 =
            eclipticToEquatorial(geoEcl);

        /*
           Precess to equator of date.
        */

        const geoEqDate =
            precess(geoEqJ2000, T);

        /*
           RA and declination.
        */

        const rd =
            raDec(geoEqDate);

        /*
           Greenwich sidereal time.
        */

        const gst =
            gmst(JD);

        /*
           Point on Earth directly underneath.
        */

        const ground =
            overhead(
                rd.ra,
                rd.dec,
                gst
            );

        rows.push({
            name,
            ra: rd.ra,
            dec: rd.dec,
            lat: ground.latitude,
            lon: ground.longitude
        });
    }

    /*
       Fill table.
    */

    let html = "";

    for (const r of rows) {

        html += `
        <tr>
            <td>${r.name}</td>
            <td>${formatRA(r.ra)}</td>
            <td>${r.dec.toFixed(2)}°</td>
            <td>${r.lat.toFixed(2)}°</td>
            <td>${r.lon.toFixed(2)}°</td>
        </tr>
        `;
    }

    document.getElementById("results").innerHTML = html;

    const selected =
        document.getElementById("planetSelect").value;

    const r =
        rows.find(x => x.name === selected);

    document.getElementById("info").innerHTML = `
        <b>${selected}</b><br>
        Julian Date: ${JD.toFixed(5)}<br>
        Julian centuries from J2000:
        ${T.toFixed(8)}<br><br>

        Right Ascension:
        ${formatRA(r.ra)}<br>

        Declination:
        ${r.dec.toFixed(4)}°<br>

        Overhead latitude:
        ${r.lat.toFixed(4)}°<br>

        Overhead longitude:
        ${r.lon.toFixed(4)}°
    `;

    updatePlanet(r.name, T);
}


/* =====================================================
   FORMAT RA
===================================================== */

function formatRA(degrees) {

    const hours = degrees / 15;

    const h = Math.floor(hours);

    const minutes =
        Math.floor((hours - h) * 60);

    const seconds =
        ((hours - h) * 60 - minutes) * 60;

    return `${h}h ${minutes}m ${seconds.toFixed(1)}s`;
}


/* =====================================================
   THREE.JS VISUALIZATION
===================================================== */

let scene, camera, renderer;
let planetMeshes = {};
let earthMesh;
let selectedMesh;

function initScene() {

    scene =
        new THREE.Scene();

    camera =
        new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.01,
            1000
        );

    camera.position.set(0, 12, 22);

    renderer =
        new THREE.WebGLRenderer({
            antialias: true
        });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    document
        .getElementById("canvas")
        .appendChild(renderer.domElement);

    /*
       Sun.
    */

    const sunGeometry =
        new THREE.SphereGeometry(.35, 32, 32);

    const sunMaterial =
        new THREE.MeshBasicMaterial();

    const sun =
        new THREE.Mesh(
            sunGeometry,
            sunMaterial
        );

    scene.add(sun);

    /*
       Earth.
    */

    const earthGeometry =
        new THREE.SphereGeometry(.18, 24, 24);

    const earthMaterial =
        new THREE.MeshBasicMaterial();

    earthMesh =
        new THREE.Mesh(
            earthGeometry,
            earthMaterial
        );

    scene.add(earthMesh);

    /*
       Planets.
    */

    const names = [
        "Mercury",
        "Venus",
        "Mars",
        "Jupiter",
        "Saturn",
        "Uranus",
        "Neptune",
	"Pluto"
    ];

    for (const name of names) {

        const radius =
            name === "Jupiter" ? .30 :
            name === "Saturn" ? .26 :
            name === "Uranus" ? .22 :
            name === "Neptune" ? .22 :
            .12;

        const geometry =
            new THREE.SphereGeometry(
                radius,
                24,
                24
            );

        const material =
            new THREE.MeshBasicMaterial();

        const mesh =
            new THREE.Mesh(
                geometry,
                material
            );

        scene.add(mesh);

        planetMeshes[name] = mesh;
    }

    animate();
}


/* =====================================================
   UPDATE 3D POSITIONS
===================================================== */

function updatePlanet(name, T) {

    const earth =
        planetPosition("Earth", T);

    earthMesh.position.set(
        earth.x,
        earth.z,
        -earth.y
    );

    for (const planetName in planetMeshes) {

        const p =
            planetPosition(
                planetName,
                T
            );

        const mesh =
            planetMeshes[planetName];

        /*
           Re-orient axes for the display.
        */

        mesh.position.set(
            p.x,
            p.z,
            -p.y
        );
    }

    /*
       Highlight selected planet by scaling.
    */

    for (const planetName in planetMeshes) {
        planetMeshes[planetName].scale.set(
            1,1,1
        );
    }

    if (planetMeshes[name]) {

        planetMeshes[name].scale.set(
            1.7,1.7,1.7
        );
    }
}


/* =====================================================
   ANIMATION
===================================================== */

function animate() {

    requestAnimationFrame(animate);

    scene.rotation.y += 0.0005;

    renderer.render(
        scene,
        camera
    );
}


window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =====================================================
   INITIALIZE
===================================================== */

initScene();

const now =
    new Date();

const iso =
    new Date(
        now.getTime()
        - now.getTimezoneOffset()*60000
    )
    .toISOString()
    .slice(0,16);

document.getElementById(
    "datetime"
).value = iso;

calculate();

</script>

</body>
</html>
