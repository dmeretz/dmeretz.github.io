
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Mars Ephemeris</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }

    button {
      font-size: 18px;
      padding: 10px 20px;
      cursor: pointer;
    }

    #output {
      margin-top: 20px;
      font-size: 20px;
    }

    canvas {
      display: block;
      margin-top: 30px;
      border: 1px solid #ccc;
    }

    .equation {
      font-family: serif;
      font-size: 19px;
      margin: 15px 0;
    }
  </style>
</head>

<body>

<h1>Where is Mars?</h1>

<p>
  This page computes an approximate position of Mars using
  Kepler's laws and a simple two-dimensional model of the solar system.
</p>

<button onclick="calculateMars()">Calculate Mars</button>

<div id="output"></div>

<canvas id="sky" width="600" height="600"></canvas>


<script>

/************************************************************
 * CONSTANTS
 ************************************************************/

// J2000 epoch
const J2000 = new Date("2000-01-01T12:00:00Z");

// Earth's orbital parameters
const Earth = {
  a: 1.000000,       // AU
  e: 0.0167,
  period: 365.256,   // days

  // Approximate mean anomaly at J2000
  M0: -0.043
};

// Mars' orbital parameters
const Mars = {
  a: 1.523679,       // AU
  e: 0.0934,
  period: 686.980,    // days

  // Approximate mean anomaly at J2000
  M0: 0.524
};

// Earth's axial tilt (obliquity of the ecliptic)
const epsilon = 23.439 * Math.PI / 180;


/************************************************************
 * BASIC UTILITIES
 ************************************************************/

function degrees(radians) {
  return radians * 180 / Math.PI;
}

function radians(degrees) {
  return degrees * Math.PI / 180;
}


// Put an angle into the interval [0, 2π)
function normalizeAngle(theta) {
  theta = theta % (2 * Math.PI);

  if (theta < 0) {
    theta += 2 * Math.PI;
  }

  return theta;
}


/************************************************************
 * TIME
 ************************************************************/

function daysSinceJ2000(date) {
  return (date - J2000) / (1000 * 60 * 60 * 24);
}


/************************************************************
 * KEPLER'S EQUATION
 *
 * M = E - e sin(E)
 *
 * We solve this using Newton's method.
 ************************************************************/

function solveKepler(M, e) {

  // Initial guess
  let E = M;

  for (let i = 0; i < 20; i++) {

    const f = E - e * Math.sin(E) - M;

    const fp = 1 - e * Math.cos(E);

    const correction = f / fp;

    E = E - correction;

    // Stop when Newton's method has converged
    if (Math.abs(correction) < 1e-10) {
      break;
    }
  }

  return E;
}


/************************************************************
 * PLANET POSITION
 *
 * In the orbital plane:
 *
 * x = a(cos E - e)
 *
 * y = a sqrt(1-e²) sin E
 *
 ************************************************************/

function planetPosition(planet, days) {

  // Mean motion
  const n = 2 * Math.PI / planet.period;

  // Mean anomaly
  const M = normalizeAngle(planet.M0 + n * days);

  // Solve Kepler's equation
  const E = solveKepler(M, planet.e);

  // Position in the orbital plane
  const x =
    planet.a * (Math.cos(E) - planet.e);

  const y =
    planet.a *
    Math.sqrt(1 - planet.e * planet.e) *
    Math.sin(E);

  return {
    x: x,
    y: y
  };
}


/************************************************************
 * GEOCENTRIC POSITION OF MARS
 *
 * r_Mars/Earth = r_Mars - r_Earth
 ************************************************************/

function marsGeocentricPosition(days) {

  const earth = planetPosition(Earth, days);

  const mars = planetPosition(Mars, days);

  return {
    x: mars.x - earth.x,
    y: mars.y - earth.y
  };
}


/************************************************************
 * CONVERT FROM ECLIPTIC TO EQUATORIAL COORDINATES
 *
 * Our 2D model lies in the ecliptic plane:
 *
 *          X = x
 *          Y = y
 *          Z = 0
 *
 * Tilt the coordinate system by Earth's obliquity:
 *
 *          X = x
 *          Y = y cos(ε)
 *          Z = y sin(ε)
 *
 ************************************************************/

function eclipticToEquatorial(x, y) {

  const X = x;

  const Y = y * Math.cos(epsilon);

  const Z = y * Math.sin(epsilon);

  return {
    X: X,
    Y: Y,
    Z: Z
  };
}


/************************************************************
 * RIGHT ASCENSION AND DECLINATION
 ************************************************************/

function equatorialCoordinates(X, Y, Z) {

  const distance =
    Math.sqrt(X*X + Y*Y + Z*Z);

  // Right ascension
  let alpha = Math.atan2(Y, X);

  alpha = normalizeAngle(alpha);

  // Declination
  const delta =
    Math.asin(Z / distance);

  return {
    raRadians: alpha,
    decRadians: delta,
    distance: distance
  };
}


/************************************************************
 * CONVERT RIGHT ASCENSION TO HOURS
 *
 * 360 degrees = 24 hours
 * 15 degrees = 1 hour
 ************************************************************/

function rightAscensionHours(alpha) {

  return degrees(alpha) / 15;
}


/************************************************************
 * MAIN CALCULATION
 ************************************************************/

function calculateMars() {

  const now = new Date();

  const days = daysSinceJ2000(now);

  // Mars relative to Earth
  const geo = marsGeocentricPosition(days);

  // Tilt the ecliptic plane into the equatorial system
  const eq =
    eclipticToEquatorial(geo.x, geo.y);

  // Get RA and Dec
  const sky =
    equatorialCoordinates(eq.X, eq.Y, eq.Z);

  const raHours =
    rightAscensionHours(sky.raRadians);

  const decDegrees =
    degrees(sky.decRadians);


  /**********************************************************
   * DISPLAY RESULTS
   **********************************************************/

  document.getElementById("output").innerHTML = `

    <p><strong>Time:</strong> ${now.toUTCString()}</p>

    <p>
      <strong>Mars geocentric distance:</strong>
      ${sky.distance.toFixed(4)} AU
    </p>

    <p>
      <strong>Right Ascension:</strong>
      ${raHours.toFixed(3)} hours
    </p>

    <p>
      <strong>Declination:</strong>
      ${decDegrees.toFixed(3)}°
    </p>

    <p>
      <strong>Ecliptic longitude:</strong>
      ${degrees(Math.atan2(geo.y, geo.x))
        .toFixed(3)}°
    </p>

    <hr>

    <p>
      <strong>Model:</strong>
      2D Keplerian Earth–Mars system
    </p>

    <p>
      <strong>Newton iterations:</strong>
      used to solve Kepler's equation
    </p>
  `;


  // Draw the solar system
  drawSolarSystem(days);
}


/************************************************************
 * DRAW THE SOLAR SYSTEM
 ************************************************************/

function drawSolarSystem(days) {

  const canvas =
    document.getElementById("sky");

  const ctx =
    canvas.getContext("2d");

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  const cx = canvas.width / 2;
  const cy = canvas.height / 2;

  // Scale: AU → pixels
  const scale = 140;


  /**********************************************************
   * DRAW ORBITS
   **********************************************************/

  ctx.beginPath();

  ctx.arc(
    cx,
    cy,
    Earth.a * scale,
    0,
    2 * Math.PI
  );

  ctx.stroke();


  ctx.beginPath();

  ctx.arc(
    cx,
    cy,
    Mars.a * scale,
    0,
    2 * Math.PI
  );

  ctx.stroke();


  /**********************************************************
   * POSITIONS
   **********************************************************/

  const earth =
    planetPosition(Earth, days);

  const mars =
    planetPosition(Mars, days);


  const ex =
    cx + earth.x * scale;

  const ey =
    cy - earth.y * scale;

  const mx =
    cx + mars.x * scale;

  const my =
    cy - mars.y * scale;


  /**********************************************************
   * SUN
   **********************************************************/

  ctx.beginPath();

  ctx.arc(cx, cy, 10, 0, 2 * Math.PI);

  ctx.fillStyle = "orange";

  ctx.fill();


  /**********************************************************
   * EARTH
   **********************************************************/

  ctx.beginPath();

  ctx.arc(ex, ey, 6, 0, 2 * Math.PI);

  ctx.fillStyle = "blue";

  ctx.fill();

  ctx.fillStyle = "black";

  ctx.fillText("Earth", ex + 10, ey);


  /**********************************************************
   * MARS
   **********************************************************/

  ctx.beginPath();

  ctx.arc(mx, my, 7, 0, 2 * Math.PI);

  ctx.fillStyle = "red";

  ctx.fill();

  ctx.fillStyle = "black";

  ctx.fillText("Mars", mx + 10, my);


  /**********************************************************
   * GEOCENTRIC LINE
   **********************************************************/

  ctx.beginPath();

  ctx.moveTo(ex, ey);

  ctx.lineTo(mx, my);

  ctx.stroke();


  ctx.fillText(
    "Sun",
    cx + 12,
    cy
  );
}

</script>

</body>
</html>
